name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secretlint:
    name: secretlint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: true
      - run: pnpm run scan:secrets
