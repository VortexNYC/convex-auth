name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secretlint:
    name: secretlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          run_install: true
      - run: pnpm run scan:secrets
