name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Newest-wins: pushing to a ref supersedes the in-flight run on that ref
# instead of letting two full matrices burn in parallel. Exception: pushes
# to main queue rather than cancel — a docs-only push would otherwise
# supersede a run still validating code in the shared HEAD.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # Docs-only diffs skip the heavy wall below. This job is a required
      # status check, so it must still run and report — a job-level `if`
      # skip would leave the required check pending forever. Install +
      # lint + docs smoke still run so the job verifies what it can.
      - name: Compute change scope
        id: scope
        run: |
          files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # --no-renames: a rename lists only the destination otherwise, so
            # moving library source into docs/ would misclassify as docs-only.
            files=$(git diff --name-only --no-renames "${{ github.event.pull_request.base.sha }}"...HEAD)
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Pushes to main always run the full wall — a queued run can be
            # replaced by a newer pending one, so no diff here may skip checks.
            :
          else
            # push / dispatch: `before` is empty on dispatch and a zero SHA on
            # new-branch pushes — either way, fall back to running the full
            # wall rather than failing the diff.
            before="${{ github.event.before }}"
            if [ -n "$before" ] && git cat-file -e "$before" 2>/dev/null; then
              files=$(git diff --name-only --no-renames "$before"..HEAD)
            fi
          fi
          echo "changed files:"
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/|site/|\.changeset/|[^/]*\.mdx?$)'; then
            echo "docsonly=true" >> "$GITHUB_OUTPUT"
          else
            echo "docsonly=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm run check

      - name: Docs smoke check
        run: pnpm run docs:smoke

      - name: OpenAPI contract guard
        if: steps.scope.outputs.docsonly != 'true'
        run: node scripts/openapi-guard.mjs

      # The built artifact is identical across Node versions — building
      # once on 22.x is enough. Typecheck resolves the package's own
      # dist/ output, so it must run after build — and tsc results don't
      # vary by Node version, so it lives on the 22.x leg too. The 20.x
      # leg's unique value is proving runtime compat via the test suite.
      - name: Build packages
        if: steps.scope.outputs.docsonly != 'true' && matrix.node-version == '22.x'
        run: pnpm run build

      - name: Typecheck
        if: steps.scope.outputs.docsonly != 'true' && matrix.node-version == '22.x'
        run: pnpm run typecheck

      # Coverage runs the same suite instrumented — on 22.x it subsumes
      # the plain test run, so the suite executes once per matrix leg
      # instead of twice. NOTE: `test` is recursive (vp run -r) while
      # `test:coverage` targets @vortex-api/convex-auth only — if another
      # package gains a test script, widen coverage to match.
      - name: Run tests
        if: steps.scope.outputs.docsonly != 'true' && matrix.node-version != '22.x'
        run: pnpm run test

      - name: Run test coverage
        if: steps.scope.outputs.docsonly != 'true' && matrix.node-version == '22.x'
        run: pnpm run test:coverage
