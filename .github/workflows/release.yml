name: Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  actions: write
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version and publish
    # GitHub-hosted: npm sigstore provenance rejects self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter "./packages/*" run build

      - name: Create release PR or publish
        id: changesets
        # v2.1.2 — v1.x parsed `changeset publish` stdout for `New tag:` lines,
        # which CLI v3 no longer prints; v2 reads the CHANGESETS_OUTPUT file.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          version-script: pnpm version-packages
          publish-script: pnpm ci:publish
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance attestations (sigstore) — requires `id-token: write`,
          # already granted at the workflow level.
          NPM_CONFIG_PROVENANCE: "true"

      - name: Trigger CI on release PR
        if: steps.changesets.outputs['has-changesets'] == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --ref changeset-release/main --repo ${{ github.repository }}
