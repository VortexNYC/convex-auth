packages:
  - packages/auth
  - packages/tsconfig
  - examples/*
  - site

auditConfig:
  # These CVEs are in `image-size` (transitive of `blume`, the docs-site builder).
  # They are DoS via malformed ICNS/JXL/HEIF image parsing and only affect
  # build-time asset handling in the docs site, not the published auth package.
  ignoreCves:
    - "1138808" # image-size ICNS parser infinite loop (CVE-2025-71330)
    - "1138809" # image-size JXL/HEIF parser infinite loop (CVE-2025-71329)

# The lockfile is generated on macOS but installed on linux CI — without
# this, pnpm prunes non-darwin optional deps (native binaries like
# @rollup/rollup-linux-x64-gnu) out of the lockfile and linux installs
# break with MODULE_NOT_FOUND.
supportedArchitectures:
  os: [darwin, linux, win32]
  cpu: [arm64, x64]
  libc: [glibc, musl]

onlyBuiltDependencies:
  - argon2

patchedDependencies:
  uniwind: patches/uniwind.patch

overrides:
  "@better-auth/utils": 0.5.0
  "@vitest/browser-preview": ^5.0.1
  "@vitest/mocker@>=2.1.0 <5.0.1": ^5.0.1
  astro@<7.2.8: ">=7.2.8"
  babel-plugin-istanbul: ^8.0.2
  chromium-edge-launcher: ^2.0.1
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  qs@>=2.2.5 <6.16.0: ">=6.16.0"
  qs@>=6.14.2 <=6.15.3: ">=6.16.0"
  # A second react minor splits convex into per-peer-context instances; the
  # Registered* types then fail cross-instance inference and action returns
  # degrade to `unknown`. One react version keeps one convex type identity.
  react: 19.3.0
  react-dom: 19.3.0
  react-native: ^0.86.0
  test-exclude: ^8.0.0
  uuid: ^14.0.0
  vite: "npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0"
  vitest: 5.0.1

peerDependencyRules:
  allowedVersions:
    "@better-auth/utils": ">=0.4.2 <0.6.0"
